name: windows-build

on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2.16.0
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
      - run: git config --system core.longpaths true
      - run: flutter pub get
      - run: flutter test test/bangumi_list_cover_test.dart
      - run: flutter build windows
      - run: Compress-Archive build/windows/x64/runner/Release/* Kazumi_windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Kazumi_windows
          path: Kazumi_windows.zip
          retention-days: 14
